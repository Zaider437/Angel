<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>С Днём Рождения, Ангелина! 🎂</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #0a0a0f;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
    perspective: 1200px;
  }

  canvas#bg {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  .card {
    position: relative;
    z-index: 10;
    width: 620px;
    max-width: 95vw;
    padding: 60px 50px 50px;
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 32px;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.05) inset,
      0 0 120px rgba(180, 130, 255, 0.15);
    transform: rotateY(-8deg) rotateX(4deg);
    transform-style: preserve-3d;
    animation: cardFloat 8s ease-in-out infinite;
    text-align: center;
    color: #fff;
  }

  @keyframes cardFloat {
    0%, 100% { transform: rotateY(-8deg) rotateX(4deg) translateY(0); }
    50%      { transform: rotateY(-6deg) rotateX(2deg) translateY(-18px); }
  }

  .shine {
    position: absolute;
    inset: 0;
    border-radius: 32px;
    background: linear-gradient(
      135deg,
      rgba(255,255,255,0) 0%,
      rgba(255,255,255,0.08) 45%,
      rgba(255,255,255,0.18) 50%,
      rgba(255,255,255,0.08) 55%,
      rgba(255,255,255,0) 100%
    );
    background-size: 300% 300%;
    animation: shine 5s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes shine {
    0%, 100% { background-position: 200% 0; }
    50%       { background-position: -100% 0; }
  }

  .ribbon {
    display: inline-block;
    font-size: 13px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 18px;
    animation: fadeIn 1.5s ease both;
  }

  .name {
    font-size: clamp(42px, 8vw, 76px);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 10px;
    background: linear-gradient(
      90deg,
      #ff6ec7, #7873f5, #42d392, #f9d423, #ff6ec7
    );
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: iridescent 6s linear infinite, fadeIn 2s ease both;
    filter: drop-shadow(0 0 30px rgba(180,130,255,0.4));
    letter-spacing: 2px;
  }

  .emoji-line {
    font-size: 38px;
    letter-spacing: 12px;
    margin: 20px 0 28px;
    animation: fadeIn 2s 0.4s ease both;
  }

  .message {
    font-size: clamp(16px, 2.5vw, 20px);
    line-height: 1.7;
    color: rgba(255,255,255,0.88);
    margin-bottom: 36px;
    font-style: italic;
    animation: fadeIn 2s 0.8s ease both;
  }

  .message strong {
    font-style: normal;
    background: linear-gradient(90deg, #ff9a9e, #fad0c4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    margin: 0 auto 28px;
    animation: fadeIn 2s 1s ease both;
  }

  .ps {
    font-size: 14px;
    color: rgba(255,255,255,0.45);
    line-height: 1.6;
    font-style: italic;
    animation: fadeIn 2s 1.3s ease both;
  }

  .flower-canvas {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 5;
  }

  @keyframes iridescent {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .floating-flowers {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }

  .petal {
    position: absolute;
    width: 18px;
    height: 18px;
    border-radius: 50% 0 50% 50%;
    opacity: 0;
    animation: petalFall linear infinite;
  }

  @keyframes petalFall {
    0%   { opacity: 0; transform: translateY(-5vh) rotate(0deg) scale(0.5); }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.6; }
    100% { opacity: 0; transform: translateY(105vh) rotate(720deg) scale(1); }
  }

  .sparkle {
    position: fixed;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    z-index: 4;
    animation: sparkle 3s ease-in-out infinite;
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50%       { opacity: 1; transform: scale(1); box-shadow: 0 0 8px white, 0 0 16px #ff6ec7; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<div class="floating-flowers" id="flowers"></div>

<div class="card">
  <div class="shine"></div>
  <div class="ribbon">С Днём Рождения</div>
  <div class="emoji-line">🌸 ✨ 🌸</div>
  <h1 class="name">Ангелина</h1>
  <p class="message">
    Ты достойна большего.<br>
    Люди, которые тебя ценят,<br>
    всегда будут рядом.
  </p>
  <div class="divider"></div>
  <p class="ps">
    P.S. Не знал, какие цветы ты любишь…<br>
    но мне кажется, виртуальные цветы тоже не плохо 🌺
  </p>
</div>

<script>
  // === Background canvas - iridescent particles ===
  const canvas = document.getElementById('bg');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  resize();
  addEventListener('resize', resize);

  const hues = [280, 320, 200, 40, 160];
  const particles = Array.from({ length: 180 }, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    r: Math.random() * 2.5 + 0.5,
    hue: hues[Math.floor(Math.random() * hues.length)],
    speed: Math.random() * 0.4 + 0.1,
    phase: Math.random() * Math.PI * 2,
    drift: (Math.random() - 0.5) * 0.3,
  }));

  let t = 0;
  function drawBg() {
    ctx.clearRect(0, 0, W, H);
    t += 0.005;
    for (const p of particles) {
      p.y -= p.speed;
      p.x += Math.sin(t + p.phase) * 0.4 + p.drift;
      if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
      if (p.x < -10) p.x = W + 10;
      if (p.x > W + 10) p.x = -10;
      const hue = (p.hue + Math.sin(t * 2 + p.phase) * 40 + 360) % 360;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${hue}, 90%, 70%, ${0.4 + Math.sin(t + p.phase) * 0.3})`;
      ctx.shadowBlur = 12;
      ctx.shadowColor = `hsl(${hue}, 90%, 65%)`;
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    requestAnimationFrame(drawBg);
  }
  drawBg();

  // === Floating petals ===
  const flowerContainer = document.getElementById('flowers');
  const petalColors = [
    'radial-gradient(circle at 30% 30%, #ff9a9e, #ff6ec7)',
    'radial-gradient(circle at 30% 30%, #a18cd1, #fbc2eb)',
    'radial-gradient(circle at 30% 30%, #ffecd2, #fcb69f)',
    'radial-gradient(circle at 30% 30%, #ffd1ff, #f9a8d4)',
    'radial-gradient(circle at 30% 30%, #c3cfe2, #f5f7fa)',
    'radial-gradient(circle at 30% 30%, #667eea, #764ba2)',
  ];

  function spawnPetal() {
    const el = document.createElement('div');
    el.className = 'petal';
    const size = Math.random() * 18 + 10;
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.left = Math.random() * 100 + '%';
    el.style.background = petalColors[Math.floor(Math.random() * petalColors.length)];
    el.style.animationDuration = (Math.random() * 8 + 8) + 's';
    el.style.animationDelay = '0s';
    flowerContainer.appendChild(el);
    setTimeout(() => el.remove(), 16000);
  }

  setInterval(spawnPetal, 400);
  for (let i = 0; i < 12; i++) setTimeout(spawnPetal, i * 300);

  // === Sparkles ===
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 3 + 's';
    s.style.animationDuration = (Math.random() * 2 + 2) + 's';
    document.body.appendChild(s);
  }

  // === Mouse parallax ===
  document.addEventListener('mousemove', e => {
    const x = (e.clientX / innerWidth - 0.5) * 14;
    const y = (e.clientY / innerHeight - 0.5) * 8;
    document.querySelector('.card').style.transform =
      `rotateY(${-8 + x}deg) rotateX(${4 - y}deg)`;
  });
</script>

</body>
</html>
