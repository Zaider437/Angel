<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Письмо для Ангелины</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e, #0f0c29);
    background-size: 400% 400%;
    animation: aurora 20s ease infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
  }
  
  @keyframes aurora {
    0%, 100% { background-position: 0% 50%; }
    25% { background-position: 100% 0%; }
    50% { background-position: 100% 100%; }
    75% { background-position: 0% 100%; }
  }
  
  .blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.35;
    z-index: 0;
    pointer-events: none;
  }
  
  .blob-1 { width: 500px; height: 500px; background: #ff6ec7; top: -100px; left: -100px; animation: b1 12s ease-in-out infinite; }
  .blob-2 { width: 400px; height: 400px; background: #42d392; bottom: -50px; right: -50px; animation: b2 15s ease-in-out infinite; }
  .blob-3 { width: 300px; height: 300px; background: #f9d423; top: 50%; left: 50%; transform: translate(-50%, -50%); animation: b3 10s ease-in-out infinite; }
  .blob-4 { width: 350px; height: 350px; background: #7873f5; top: 30%; right: -80px; animation: b4 18s ease-in-out infinite; }
  .blob-5 { width: 280px; height: 280px; background: #ff9a9e; bottom: 10%; left: 10%; animation: b5 14s ease-in-out infinite; }
  
  @keyframes b1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(100px, 50px) scale(1.1); } }
  @keyframes b2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-80px, -60px) scale(1.15); } }
  @keyframes b3 { 0%, 100% { transform: translate(-50%, -50%) scale(1); } 50% { transform: translate(-40%, -60%) scale(1.2); } }
  @keyframes b4 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-60px, 40px) scale(1.1); } }
  @keyframes b5 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(50px, -40px) scale(1.15); } }
  
  .vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.5) 100%);
    z-index: 2;
    pointer-events: none;
  }
  
  .scene {
    position: relative;
    z-index: 10;
    width: 700px;
    max-width: 95vw;
    height: 520px;
    perspective: 1200px;
    perspective-origin: 50% 40%;
    cursor: pointer;
  }
  
  .envelope {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transform: rotateY(-6deg) rotateX(3deg);
    transition: transform 1.4s cubic-bezier(0.23, 1, 0.32, 1);
    will-change: transform;
  }
  
  .envelope.open {
    transform: rotateY(0deg) rotateX(0deg) translateY(-50px);
  }
  
  .envelope-body {
    position: absolute;
    bottom: 0;
    left: 5%;
    width: 90%;
    height: 75%;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.05) inset;
    transform: translateZ(0);
    backface-visibility: hidden;
  }
  
  .envelope-flap {
    position: absolute;
    top: 0;
    left: 5%;
    width: 90%;
    height: 55%;
    background: linear-gradient(135deg, #1e2a4a 0%, #1a1a2e 100%);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px 16px 0 0;
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
    z-index: 2;
    box-shadow: 0 -5px 30px rgba(0,0,0,0.4);
    backface-visibility: hidden;
    will-change: transform;
  }
  
  .envelope.open .envelope-flap {
    transform: rotateX(180deg);
    z-index: 0;
  }
  
  .letter {
    position: absolute;
    bottom: 4%;
    left: 8%;
    width: 84%;
    height: 88%;
    background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1e 100%);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 36px 28px;
    text-align: center;
    color: #fff;
    transform-style: preserve-3d;
    transform: translateZ(20px);
    transition: transform 0.9s 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.05) inset;
    z-index: 1;
    will-change: transform;
  }
  
  .envelope.open .letter {
    transform: translateZ(50px) translateY(-35px);
  }
  
  .letter-shine {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 55%, rgba(255,255,255,0) 100%);
    background-size: 300% 300%;
    animation: shine 5s ease-in-out infinite;
    pointer-events: none;
  }
  
  @keyframes shine {
    0%, 100% { background-position: 200% 0; }
    50% { background-position: -100% 0; }
  }
  
  .ribbon {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 14px;
  }
  
  .emoji-line {
    font-size: 28px;
    letter-spacing: 10px;
    margin: 14px 0 18px;
  }
  
  .name {
    font-size: clamp(32px, 7vw, 58px);
    font-weight: 700;
    line-height: 1.1;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #ff6ec7, #7873f5, #42d392, #f9d423, #ff6ec7);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: iridescent 6s linear infinite;
    filter: drop-shadow(0 0 25px rgba(180,130,255,0.5));
    letter-spacing: 2px;
  }
  
  .message {
    font-size: clamp(14px, 2vw, 17px);
    line-height: 1.65;
    color: rgba(255,255,255,0.85);
    margin-bottom: 22px;
    font-style: italic;
  }
  
  .message strong {
    font-style: normal;
    background: linear-gradient(90deg, #ff9a9e, #fad0c4);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  
  .divider {
    width: 50px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    margin: 0 auto 18px;
  }
  
  .ps {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    line-height: 1.6;
    font-style: italic;
  }
  
  .hint {
    position: absolute;
    bottom: -44px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    letter-spacing: 2px;
    white-space: nowrap;
    animation: pulse 2s ease-in-out infinite;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }
  
  @keyframes iridescent {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  
  .envelope, .envelope-flap, .letter, .name, .letter-shine {
    backface-visibility: hidden;
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>
<div class="blob blob-4"></div>
<div class="blob blob-5"></div>
<div class="vignette"></div>

<div class="scene" id="scene">
  <div class="envelope" id="envelope">
    <div class="letter">
      <div class="letter-shine"></div>
      <div class="ribbon">С Днём Рождения</div>
      <div class="emoji-line">🌸 ✨ 🌸</div>
      <h1 class="name">Ангелина</h1>
      <p class="message">
        Ты достойна большего.<br>
        Люди, которые тебя ценят,<br>
        всегда будут рядом.
      </p>
      <div class="divider"></div>
      <p class="ps">
        P.S. Не знал, какие цветы ты любишь…<br>
        но мне кажется, виртуальные цветы тоже не плохо 🌺
      </p>
    </div>
    <div class="envelope-body"></div>
    <div class="envelope-flap" id="flap"></div>
  </div>
  <div class="hint" id="hint">✦ нажмите, чтобы открыть ✦</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
  // === 3D background flowers ===
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;z-index:1;pointer-events:none;';
  document.body.prepend(canvas);
  
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
  camera.position.z = 20;
  
  const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  
  scene.add(new THREE.AmbientLight(0xffffff, 0.4));
  const light = new THREE.PointLight(0xffffff, 2, 60);
  light.position.set(10, 10, 20);
  scene.add(light);
  
  const tmpColor = new THREE.Color();
  const flowers = [];
  
  function makeMat() {
    return new THREE.MeshPhongMaterial({
      color: 0xffffff,
      emissive: 0xffffff,
      emissiveIntensity: 0.35,
      shininess: 40,
      flatShading: true,
      side: THREE.DoubleSide
    });
  }
  
  function createSimpleFlower() {
    const g = new THREE.Group();
    const mat = makeMat();
    const geo = new THREE.SphereGeometry(0.35, 8, 6);
    const n = 5;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(geo, mat);
      const a = (i / n) * Math.PI * 2;
      m.position.set(Math.cos(a)*0.35, 0, Math.sin(a)*0.35);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(Math.cos(a), 0.4, Math.sin(a)).normalize());
      m.scale.set(1, 0.15, 1.4);
      g.add(m);
    }
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 8), mat));
    g.userData.mat = mat;
    return g;
  }
  
  function createMultiLayerFlower() {
    const g = new THREE.Group();
    const mat = makeMat();
    const geo = new THREE.SphereGeometry(0.3, 8, 6);
    for (let layer = 0; layer < 2; layer++) {
      const n = layer === 0 ? 5 : 8;
      const r = layer === 0 ? 0.25 : 0.5;
      const tilt = layer === 0 ? 0.5 : 0.35;
      const sc = layer === 0 ? [1, 0.2, 1] : [1.2, 0.15, 1.5];
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(geo, mat);
        const a = (i / n) * Math.PI * 2 + (layer * 0.2);
        m.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
        m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(Math.cos(a), tilt, Math.sin(a)).normalize());
        m.scale.set(...sc);
        g.add(m);
      }
    }
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.2, 8, 8), mat));
    g.userData.mat = mat;
    return g;
  }
  
  function createSpikyFlower() {
    const g = new THREE.Group();
    const mat = makeMat();
    const geo = new THREE.ConeGeometry(0.08, 0.6, 6);
    const n = 14;
    for (let i = 0; i < n; i++) {
      const m = new THREE.Mesh(geo, mat);
      const a = (i / n) * Math.PI * 2;
      m.position.set(Math.cos(a)*0.4, 0, Math.sin(a)*0.4);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(Math.cos(a), 0.3, Math.sin(a)).normalize());
      g.add(m);
    }
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), mat));
    g.userData.mat = mat;
    return g;
  }
  
  function createBellFlower() {
    const g = new THREE.Group();
    const mat = makeMat();
    const n = 6;
    for (let i = 0; i < n; i++) {
      const geo = new THREE.SphereGeometry(0.32, 8, 6);
      const m = new THREE.Mesh(geo, mat);
      const a = (i / n) * Math.PI * 2 + 0.2;
      m.position.set(Math.cos(a)*0.45, -0.15, Math.sin(a)*0.45);
      m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), new THREE.Vector3(Math.cos(a), 0.25, Math.sin(a)).normalize());
      m.scale.set(1.2, 0.12, 1.6);
      g.add(m);
    }
    g.add(new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), mat));
    g.userData.mat = mat;
    return g;
  }
  
  const builders = [createSimpleFlower, createMultiLayerFlower, createSpikyFlower, createBellFlower];
  
  for (let i = 0; i < 50; i++) {
    const f = builders[Math.floor(Math.random() * builders.length)]();
    f.position.set(
      (Math.random() - 0.5) * 50,
      (Math.random() - 0.5) * 35,
      (Math.random() - 0.5) * 25 - 3
    );
    f.rotation.set(Math.random()*Math.PI*2, Math.random()*Math.PI*2, Math.random()*Math.PI*2);
    const s = Math.random() * 1.1 + 0.4;
    f.scale.set(s, s, s);
    f.userData.rot = new THREE.Vector3((Math.random()-0.5)*0.006, (Math.random()-0.5)*0.006, (Math.random()-0.5)*0.004);
    f.userData.hue = Math.random();
    f.userData.hueSpeed = 0.01 + Math.random() * 0.035;
    f.userData.floatSpeed = 0.25 + Math.random() * 0.4;
    f.userData.floatPhase = Math.random() * Math.PI * 2;
    f.userData.baseY = f.position.y;
    f.userData.baseX = f.position.x;
    f.userData.ampY = Math.random() * 0.4;
    f.userData.ampX = Math.random() * 0.3;
    scene.add(f);
    flowers.push(f);
  }
  
  let mouseX = 0, mouseY = 0;
  document.addEventListener('mousemove', e => {
    mouseX = (e.clientX / innerWidth - 0.5) * 2;
    mouseY = (e.clientY / innerHeight - 0.5) * 2;
  });
  
  function animate() {
    requestAnimationFrame(animate);
    const t = performance.now() * 0.001;
    
    camera.position.x += (mouseX * 2.5 - camera.position.x) * 0.025;
    camera.position.y += (-mouseY * 1.5 - camera.position.y) * 0.025;
    camera.lookAt(0, 0, 0);
    
    for (const f of flowers) {
      const u = f.userData;
      f.rotation.x += u.rot.x;
      f.rotation.y += u.rot.y;
      f.rotation.z += u.rot.z;
      f.position.y = u.baseY + Math.sin(t * u.floatSpeed + u.floatPhase) * u.ampY;
      f.position.x = u.baseX + Math.cos(t * u.floatSpeed * 0.7 + u.floatPhase) * u.ampX;
      
      const hue = (u.hue + t * u.hueSpeed) % 1;
      tmpColor.setHSL(hue, 0.85, 0.55);
      u.mat.color.copy(tmpColor);
      u.mat.emissive.copy(tmpColor);
    }
    
    renderer.render(scene, camera);
  }
  animate();
  
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  
  // === Envelope open/close ===
  const sceneEl = document.getElementById('scene');
  const envelope = document.getElementById('envelope');
  const hint = document.getElementById('hint');
  let isOpen = false;
  
  function toggleEnvelope(e) {
    if (isOpen) {
      envelope.classList.remove('open');
      hint.style.display = 'block';
    } else {
      envelope.classList.add('open');
      hint.style.display = 'none';
    }
    isOpen = !isOpen;
  }
  
  sceneEl.addEventListener('click', toggleEnvelope);
</script>

</body>
</html>
